# Robot Detection Parameters
# Loaded by default in launch file
# Set enable_robot_detection in common.yaml to activate

sonar_3d_mapper:
  ros__parameters:
    robot_detection:
      min_threshold: 180         # intensity >= this = robot (high reflectivity)
      topic: "/sonar_robot_detections"
    terrain_detection:
      min_threshold: 80          # terrain intensity range (common.yaml과 일치)
      max_threshold: 180         # common.yaml과 일치
