# Common Parameters for 3D Sonar Mapper
# These are shared across all probability update methods

sonar_3d_mapper:
  ros__parameters:
    #===== Sonar Sensor =====
    horizontal_fov: 130.0        # degrees
    vertical_aperture: 20.0      # degrees
    max_range: 3.5              # meters
    min_range: 1.0               # meters
    intensity_threshold: 180     # 0-255

    #===== Sonar Mounting (relative to base_link) =====
    sonar_position:
      x: 0.0
      y: 0.0
      z: -0.1
    sonar_orientation:
      roll: 0.0                  # degrees
      pitch: 90.0                # degrees (90 = pointing down)
      yaw: 0.0                   # degrees

    #===== Voxel Map =====
    voxel_resolution: 0.1       # meters
    use_cpp_backend: true

    #===== Probability Update =====
    # Method: "weighted_average" | "log_odds" | "iwlo"
    #   - weighted_average: voxelmap_fusion style, uses intensity for weighted probability average
    #   - log_odds: traditional Bayesian, additive log-odds update
    #   - iwlo: Intensity-Weighted Log-Odds, combines both approaches (recommended)
    # Note: Method-specific params are in method_*.yaml files, loaded via launch arg
    probability_update_method: "iwlo"

    #===== Probability Threshold =====
    occupied_threshold: 0.7      # prob >= this = occupied, prob < this = free

    #===== Processing =====
    frame_skip: 5                # process every N frames
    enable_robot_detection: false

    #===== ROS2 Interface =====
    sonar_frame_id: "sonar_link"
    base_frame_id: "body"
    map_frame_id: "camera_init"
    publish_tf: false

    sonar_topic: "/sensor/sonar/oculus/m3000d/image"
    odometry_topic: "/fast_lio/odometry"
    pointcloud_topic: "/sonar_3d_map"
    marker_topic: "/sonar_3d_map_markers"

    #===== Visualization =====
    show_free_space: false
    show_opencv_visualization: true
    use_sim_time: true

    #===== Launch Options =====
    launch_fast_lio: true
    launch_rviz: true

    #===== Bag Playback =====
    play_bag: true
    bag_file: "/workspace/data/4_yeondong_hang/20251029_blueboat_sonar_lidar/tilt90-range3.5_v3"
    bag_playback_rate: 1.0

    #===== Bag Recording (optional) =====
    record_bag: false
    record_output_path: "/workspace/data/recorded_mapping"
    record_topics: "all"
