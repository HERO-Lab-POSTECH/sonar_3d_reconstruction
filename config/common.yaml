# Common Parameters for 3D Sonar Mapper
# These are shared across all probability update methods

sonar_3d_mapper:
  ros__parameters:
    #===== Filtering (Dynamic) =====
    filtering:
      min_range: 1.0               # meters (max_range is received from /param/range topic)
      intensity_threshold: 120     # 0-255

    #===== Mapping (Dynamic) =====
    mapping:
      occupied_threshold: 0.7      # prob >= this = occupied, prob < this = free
      angular_cone_width: 0.5      # 0.5 = 0% overlap (strict), 1.0 = 100% overlap (permissive)

    #===== Processing (Dynamic) =====
    processing:
      frame_skip: 5                # process every N frames

    #===== Visualization (Dynamic) =====
    visualization:
      show_opencv_visualization: true
      pointcloud_publish_rate: 10.0  # Hz - PointCloud2 publishing rate (in-memory mode)
      tile_save_interval: 5.0       # seconds - dirty tile save interval (out-of-core mode)

    #===== Octree =====
    octree:
      voxel_resolution: 0.1        # meters (read-only)
      use_cpp_backend: true        # (read-only)
      dynamic_expansion: true      # (dynamic)

    #===== Sonar Hardware (Read-only) =====
    sonar:
      horizontal_fov: 130.0        # degrees
      vertical_aperture: 20.0      # degrees

    #===== Mounting =====
    mounting:
      position:                    # (read-only)
        x: 0.0
        y: 0.0
        z: -0.1
      orientation:                 # (dynamic - can change at runtime)
        roll: 0.0                  # degrees
        pitch: 90.0                # degrees (90 = pointing down)
        yaw: 0.0                   # degrees

    #===== Out-of-Core Storage (Read-only) =====
    outofcore:
      use: true                              # true = disk-based, false = RAM-based
      map_path: "/workspace/data/5_khnp/20251219_seafloor_mapping/raw_oculus_m3000d_test_v1/map_tiles"       # Tile storage directory
      tile_size: 0.4                         # Tile size in meters
      cache_size: 16                         # Max tiles in memory

    #===== Crosstalk Filter =====
    # When enabled=true, detailed settings are loaded from config/crosstalk_filter.yaml
    crosstalk:
      enabled: false

    #===== Frame IDs (Read-only) =====
    frames:
      sonar: "sonar_link"
      base: "body"
      map: "camera_init"           # Set world_init as fixed frame in RViz
      publish_tf: false

    #===== Topics (Read-only) =====
    topics:
      sonar: "/sensor/sonar/oculus/m3000d/image"  # range_topic is auto-generated: {base}/param/range
      odometry: "/fast_lio/odometry"
      pointcloud: "/sonar_3d_map"
      marker: "/sonar_3d_map_markers"

    #===== Robot Detection =====
    # When enabled=true, terrain_detection params are also used
    robot_detection:
      enabled: false
      min_threshold: 180
      topic: "/sonar_robot_detections"
    terrain_detection:
      min_threshold: 80
      max_threshold: 180

    #===== Recording (Read-only) =====
    recording:
      bag: false
      base_path: "/workspace/data/experiments"  # Base directory for recordings
      prefix: "test"
      # Output path is auto-generated: {record_base_path}/YYYYMMDD_HHMMSS/

    #===== World Init Broadcaster =====
    world_init:
      imu_topic: "/sensor/ins/livox_mid360/imu"
      init_samples: 50
      parent_frame: "world_init"
      child_frame: "camera_init"

    #===== Launch Options =====
    use_sim_time: true
    launch_fast_lio: true
    launch_rviz: true
    rviz_config: "3d_mapping.rviz"  # rviz config file name (in rviz/ folder)

    #===== Bag Playback =====
    play_bag: true
    bag_file: "/workspace/data/5_khnp/20251219_seafloor_mapping/raw_oculus_m3000d_test_v1"
    bag_playback_rate: 1.0
