# ============================================================================
# Common Parameters for 3D Sonar Mapper
# ============================================================================
# Parameter Types:
#   [Static]  - Read-only, requires node restart to change
#   [Dynamic] - Can be changed at runtime via ros2 param set
#
# NOTE: Launch-time settings (sonar_model, odometry, bag_file, map_path, etc.)
#       are configured via launch arguments. See 3d_mapping.launch.py for details.
# ============================================================================

sonar_3d_mapper:
  ros__parameters:

    # ==========================================================================
    # HARDWARE CONFIGURATION [Static]
    # ==========================================================================

    sonar:
      vertical_aperture: 20.0        # [deg] Vertical beam width

    # mounting: Set by launch args (sonar_z, sonar_pitch)

    # ==========================================================================
    # DATA PROCESSING
    # ==========================================================================

    # NOTE: filtering.* and iwlo.* parameters are in config/presets/tilt_XX.yaml
    #       Selected by sonar_pitch launch argument (30, 60, 90)

    crosstalk:                       # [Dynamic] 2D FFT-based stripe removal
      enabled: true                 # Filter on/off
      filter_width: 0.02             # Notch width on bearing freq axis (0.0-1.0)
      filter_strength: 0.8           # Suppression strength (0.0-1.0)
      dc_preserve_ratio: 0.05        # DC preservation radius ratio (0.0-0.5)
      publish_filtered: true        # Publish filtered image to /sonar_3d_mapper/debug/crosstalk_filtered

    processing:                      # [Dynamic]
      frame_skip: 5                  # Process every N frames

    mapping:                         # [Dynamic]
      occupied_threshold: 0.7        # Probability threshold (>= occupied, < free)
      angular_cone_width: 0.5        # 0.5 = strict (0% overlap), 1.0 = permissive (100%)

    # ==========================================================================
    # OCTREE & STORAGE
    # ==========================================================================

    octree:
      voxel_resolution: 0.2          # [m] [Static]
      use_cpp_backend: true          # [Static]
      dynamic_expansion: true        # [Dynamic]

    outofcore:                       # [Static]
      tile_size: 0.4                 # [m] Tile size
      cache_size: 32                 # Max tiles in memory

    # ==========================================================================
    # ROS INTERFACE [Static]
    # ==========================================================================

    frames:
      sonar: "sonar_link"
      base: "base_link"              # Robot body frame (from boat_description URDF)
      map: "map"                     # Fixed frame in RViz
      publish_tf: false

    # ==========================================================================
    # TIME SYNC [Dynamic]
    # ==========================================================================
    time_sync:
      max_stamp_diff_sec: 0.1       # [s] sonar↔odom stamp diff cutoff
      max_odom_age_sec: 0.5         # [s] odom freshness cutoff (P8 ring-buffer)
      policy: "latest"              # latest | interpolate | nearest

    # ==========================================================================
    # VISUALIZATION [Dynamic]
    # ==========================================================================

    visualization:
      pointcloud_publish_rate: 10.0  # [Hz] PointCloud2 publish rate (in-memory)
      tile_save_interval: 5.0        # [s] Dirty tile save interval (out-of-core)
      marker_min_depth: 0.0          # [m] [Dynamic] marker 최소 depth
      marker_max_depth: 5.0          # [m] [Dynamic] marker 최대 depth
      marker_alpha: 0.8              # [Dynamic] marker 투명도 (0.0-1.0)
      show_opencv_visualization: false  # [Dynamic] OpenCV preview window

    # ==========================================================================
    # OUTPUT [Static]
    # ==========================================================================
    output:
      map_dir: ""                    # "" = use $PKRC_MAP_DIR or ~/data/maps
      auto_timestamp: true           # 빈 output_map_path면 YYYYMMDD_HHMMSS 디렉터리 생성

    # ==========================================================================
    # RVIZ
    # ==========================================================================

    rviz_config: "3d_mapping.rviz"   # RViz config file name (in rviz/ folder)
