# Intensity-Weighted Log-Odds (IWLO) Method
# Combines Log-Odds Bayesian with Weighted Average approach
# Use with: ros2 launch sonar_3d_reconstruction 3d_mapping.launch.py method:=iwlo

sonar_3d_mapper:
  ros__parameters:
    # Log-odds bounds (Saturation limits - OctoMap style)
    L_occ: 1.5          # Max occupied log-odds increment
    L_free: -2.0        # Free space log-odds decrement
    L_min: -2.0         # Lower bound (P ~ 0.12)
    L_max: 3.5          # Upper bound (P ~ 0.97)

    # Intensity-to-weight sigmoid transformation
    sharpness: 3.0      # Sigmoid steepness (1.0~5.0)

    # Observation count decay (learning rate annealing)
    decay_rate: 0.1     # Alpha decay rate (0.05~0.5)
    min_alpha: 0.1      # Minimum learning rate for change detection

    # Adaptive update (inherited from existing)
    adaptive_update: false
    adaptive_threshold: 0.5
    adaptive_max_ratio: 0.3
