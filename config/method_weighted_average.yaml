# Weighted Average Method (voxelmap_fusion style)
# Use with: --params-file common.yaml --params-file method_weighted_average.yaml
# Set probability_update_method in common.yaml

sonar_3d_mapper:
  ros__parameters:
    intensity_max: 255

    # Adaptive update (recommended for weighted average)
    adaptive_update: true
    adaptive_threshold: 0.5
    adaptive_max_ratio: 0.3
