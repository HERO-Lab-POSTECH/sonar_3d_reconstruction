# Parameter Configuration for 3D Sonar Mapper
# Priority order (highest to lowest):
# 1. Command line args: ros2 run/launch ... --ros-args -p param:=value
# 2. This YAML file
# 3. Launch file parameters
# 4. Node defaults (3d_mapper_node.py)
# 5. Library defaults (3d_mapper.py)

sonar_3d_mapper:
  ros__parameters:
    # Sonar sensor parameters
    horizontal_fov: 130.0        # Horizontal field of view in degrees
    vertical_aperture: 20.0      # Vertical beam aperture in degrees
    max_range: 10.0              # Maximum sonar range in meters
    min_range: 1.0               # Minimum range to filter noise in meters (was 0.5 - reduced for Yeondong data compatibility)
    intensity_threshold: 120       # Intensity threshold for occupied detection (0-255)
    
    # Terrain detection (when robot detection is enabled)
    terrain_detection:
      min_threshold: 120             # Minimum intensity for terrain detection
      max_threshold: 150            # Maximum intensity for terrain detection
    
    # Robot detection mode
    enable_robot_detection: false   # Enable separate robot detection (high intensity objects)
    robot_detection:
      min_threshold: 230            # Minimum intensity for robot detection (metal objects, max=255)
      topic: "/sonar_robot_detections"  # Topic for robot detection PointCloud2
    
    # Sonar mounting configuration (relative to base_link)
    # IMPORTANT: This configuration assumes REAL WORLD sensor coordinates
    # Sonar frame: +X forward, +Y right, +Z down (Oculus M750d standard)
    # For simulators (Gazebo), adjust orientation accordingly
    sonar_position:
      x: 0.0                     # Forward/backward offset from base_link
      y: 0.0                     # Left/right offset from base_link
      z: -0.1                    # Up/down offset (0.5m below base_link)
    
    sonar_orientation:
      # For REAL WORLD (Oculus M750d on BlueBoat):
      roll: 0.0                  # Rotation around X axis (degrees)
      pitch: 30.0                # Rotation around Y axis (degrees, 90 = pointing down)
      yaw: 0.0                   # Rotation around Z axis (degrees)
    
    # Octree voxel storage parameters
    voxel_resolution: 0.05        # Voxel size in meters (20cm) - TEST
    min_probability: 0.7         # Minimum probability to consider voxel occupied
    dynamic_expansion: true      # Enable dynamic map expansion without fixed bounds
    use_cpp_backend: true        # Use C++ ProbabilityUpdater for memory efficiency (fallback to Python if unavailable)
    
    # Z-axis filtering (remove voxels below this height)
    z_filter_min: -6.3           # Minimum Z value in meters (negative = below water surface)
    z_filter_enabled: false       # Enable Z-axis filtering
    
    # Adaptive update parameters (protect free space from noise)
    adaptive_update: true        # Enable adaptive updating
    adaptive_threshold: 0.5      # Probability threshold for protection
    adaptive_max_ratio: 0.3      # Maximum update ratio at threshold
    
    # Log-odds Bayesian update parameters
    log_odds_occupied: 0.5       # Log-odds increment for occupied voxel
    log_odds_free: -1.0          # Log-odds decrement for free space
    log_odds_min: -10.0          # Minimum log-odds value (clamping)
    log_odds_max: 10.0           # Maximum log-odds value (clamping)

    # Probability update method (voxelmap_fusion style)
    # 'log_odds': Traditional log-odds Bayesian update (fast convergence)
    # 'weighted_average': voxelmap_fusion style weighted average (observation count based)
    probability_update_method: "weighted_average"
    intensity_max: 255           # Maximum intensity value for normalization

    # Multi-threshold classification (voxelmap_fusion style)
    # Three-state classification: free (prob <= free_threshold), unknown, occupied (prob >= occupied_threshold)
    occupied_threshold: 0.7      # Probability threshold for occupied classification
    free_threshold: 0.3          # Probability threshold for free classification
    
    # Processing parameters
    frame_skip: 5                # Process every N frames (1=every frame, 2=every other frame, etc.)
    
    # Publishing parameters
    show_free_space: false       # Show free space voxels in MarkerArray
    
    # OpenCV Visualization
    show_opencv_visualization: true  # Show sonar image with intensity threshold applied
    
    # Frame IDs (aligned with Fast-LIO)
    sonar_frame_id: "sonar_link"
    base_frame_id: "body"          # Fast-LIO uses "body" for robot frame
    map_frame_id: "camera_init"    # Fast-LIO uses "camera_init" for map frame
    publish_tf: false            # Use TF from bag file instead
    
    # ROS2 Topics (for KIRO water tank data)
    sonar_topic: "/sensor/sonar/oculus/m3000d/image"
    odometry_topic: "/fast_lio/odometry"
    pointcloud_topic: "/sonar_3d_map"
    marker_topic: "/sonar_3d_map_markers"
    
    # Use simulation time for bag playback
    use_sim_time: true
    
    # Launch configuration
    launch_fast_lio: true        # Launch Fast-LIO for odometry
    launch_rviz: true            # Launch RViz for visualization
    play_bag: true              # Auto-play bag file
    bag_file: "/workspace/data/4_yeondong_hang/20251029_blueboat_sonar_lidar/tilt30-range10_v1"
    bag_playback_rate: 1.0      # Playback speed (1.0 = normal, 0.5 = half speed, 2.0 = double speed)
    
    # Bag recording configuration
    record_bag: true           # Record ROS2 bag file during mapping
    record_output_path: "/workspace/data/4_yeondong_hang/20251029_blueboat_sonar_lidar/mapping-tilt30-range10_v1"  # Path to save recorded bag file
    record_topics: "all"        # Topics to record: "all" or comma-separated list like "/sonar_3d_map,/fast_lio/odometry"