# Map Visualizer Node Parameters
# NOTE: map_path, resolution, tile_size, frame_id, occupied_threshold are
#       automatically loaded from common.yaml.

map_visualizer:
  ros__parameters:
    #===== Visualizer-specific Parameters =====
    visualization_mode: "octomap"             # "octomap", "pointcloud", or "all"
    publish_rate: 1.0                         # Hz - topic publishing rate
    auto_refresh: true                        # Auto refresh from disk
    refresh_interval: 5.0                     # seconds - interval to reload tiles from disk

    # Published topics:
    # /map_octomap (octomap_msgs/Octomap) - For RViz OctoMap plugin
    # /map_pointcloud (sensor_msgs/PointCloud2) - Point cloud with intensity

# Visualization Modes:
# - "octomap": Publish OctoMap message only (use RViz OctoMap plugin)
# - "pointcloud": Publish PointCloud2 only (intensity = probability)
# - "all": Publish both OctoMap + PointCloud2
