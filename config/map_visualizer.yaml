# Map Visualizer Node Parameters
# Values used for standalone execution (overridden by common.yaml when using 3d_mapping.launch)
# NOTE: resolution, tile_size are automatically read from metadata.json

map_visualizer:
  ros__parameters:
    # === Map settings (standalone mode) ===
    outofcore:
      map_path: "/workspace/data/map_tiles"  # Overridden by launch

    mapping:
      occupied_threshold: 0.7   # Overridden by common.yaml via launch

    frames:
      map: "camera_init"        # Overridden by common.yaml via launch

    # === Visualizer-specific parameters ===
    publish_rate: 1.0           # Hz
    auto_refresh: true          # Periodically reload tiles from disk
    refresh_interval: 5.0       # seconds

    visualization:
      mode: 1                   # 0=pointcloud, 1=octomap, 2=all
