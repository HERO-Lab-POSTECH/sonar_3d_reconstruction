# Map Visualizer Node Parameters
# NOTE: This file must define ALL parameters needed by map_visualizer node
#       because ROS2 only loads params matching the node namespace.

map_visualizer:
  ros__parameters:
    # === Shared parameters (must match common.yaml values) ===
    # These are duplicated here because common.yaml uses sonar_3d_mapper namespace
    outofcore:
      map_path: "/workspace/data/map_tiles"  # Will be overridden by launch file with timestamped path
      tile_size: 0.4

    octree:
      voxel_resolution: 0.1

    mapping:
      occupied_threshold: 0.7

    frames:
      map: "camera_init"

    # === Visualizer-specific parameters ===
    publish_rate: 1.0           # Hz - topic publishing frequency
    auto_refresh: true          # Periodically reload tiles from disk
    refresh_interval: 5.0       # seconds - reload interval

    visualization:
      mode: 1                   # 0=pointcloud, 1=octomap, 2=all
                                # NOTE: occupied_threshold only works in pointcloud mode!
