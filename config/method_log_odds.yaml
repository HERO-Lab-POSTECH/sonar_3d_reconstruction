# Log-Odds Bayesian Method (traditional)
# Use with: --params-file common.yaml --params-file method_log_odds.yaml

sonar_3d_mapper:
  ros__parameters:
    probability_update_method: "log_odds"

    # Log-odds parameters
    log_odds_occupied: 0.5
    log_odds_free: -1.0
    log_odds_min: -10.0
    log_odds_max: 10.0

    # Adaptive update (optional for log-odds)
    adaptive_update: true
    adaptive_threshold: 0.5
    adaptive_max_ratio: 0.3
