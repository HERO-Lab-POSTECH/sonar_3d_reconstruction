# Cross-talk Noise Filter Configuration
# Suppresses horizontal stripe noise from multibeam sonar

sonar_3d_mapper:
  ros__parameters:
    #===== Crosstalk Filter (Dynamic) =====
    crosstalk:
      # Morphological filter for horizontal stripe removal (vertical kernel)
      morpho_enabled: true
      morpho_kernel_size: 7            # Kernel size (odd recommended: 3, 5, 7)
      morpho_kernel_shape: "rect"      # rect, ellipse, cross

      # Azimuth consistency check: uniform high intensity across all azimuths = noise
      # intensity_threshold uses value from common.yaml
      azimuth_enabled: true
      azimuth_threshold: 0.5           # Classify as noise if % of beams above threshold

      # Adaptive threshold (experimental)
      adaptive_enabled: false
      adaptive_block_size: 11
      adaptive_c: 2
